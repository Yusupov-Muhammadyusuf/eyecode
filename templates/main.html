<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Code Assistant</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/static/css/main.css">
</head>
<body>

    <div class="container my-5" style="max-width: 1100px;">
        <header class="text-center mb-5">
            <h1 class="fw-bold mb-2">Voice Code Assistant</h1>
            <p class="text-muted">Accessible programming environment for visually impaired and handless</p>
        </header>

        <div class="row g-4">
            <div class="col-md-4">
                <div class="card p-4 shadow-sm h-100">
                    <h3 class="h5 mb-4 font-weight-semibold">
                        <i class="bi bi-mic me-2 text-primary"></i>Voice & Settings
                    </h3>
                    
                    <div class="mb-3">
                        <label for="spokenLanguage" class="form-label text-muted small">Spoken Language:</label>
                        <select id="spokenLanguage" class="form-select">
                            <option value="en" selected>English</option>
                            <option value="uz">Uzbek (O'zbekcha)</option>
                            <option value="ru">Russian (Русский)</option>
                            <option value="es">Spanish (Español)</option>
                            <option value="zh">Chinese (中文)</option>
                            <option value="hi">Hindi (हिन्दी)</option>
                            <option value="ar">Arabic (العربية)</option>
                            <option value="fr">French (Français)</option>
                            <option value="de">German (Deutsch)</option>
                            <option value="ja">Japanese (日本語)</option>
                            <option value="ko">Korean (한국어)</option>
                            <option value="tr">Turkish (Türkçe)</option>
                            <option value="pt">Portuguese (Português)</option>
                        </select>
                    </div>

                    <div class="mb-4">
                        <label for="languageSelect" class="form-label text-muted small">Target Programming Language:</label>
                        <select id="languageSelect" class="form-select">
                            <option value="python" selected>Python</option>
                            <option value="javascript">JavaScript</option>
                            <option value="typescript">TypeScript</option>
                            <option value="cpp">C++</option>
                            <option value="c">C</option>
                            <option value="csharp">C#</option>
                            <option value="java">Java</option>
                            <option value="go">Go</option>
                            <option value="rust">Rust</option>
                            <option value="php">PHP</option>
                            <option value="ruby">Ruby</option>
                            <option value="swift">Swift</option>
                            <option value="kotlin">Kotlin</option>
                            <option value="sql">SQL</option>
                        </select>
                    </div>

                    <button id="recordBtn" class="btn btn-outline-danger w-100 mb-3 d-flex align-items-center justify-content-center gap-2" aria-label="Start Recording">
                        <i class="bi bi-mic-fill"></i> Start Recording
                    </button>

                    <div class="mt-2">
                        <span class="text-muted small">Transcription:</span>
                        <p id="transcriptionText" class="p-3 bg-light rounded border text-dark mt-1" style="min-height: 80px; font-size: 0.9rem;">No audio recorded yet...</p>
                    </div>
                </div>
            </div>

            <div class="col-md-8">
                <div class="card p-4 shadow-sm h-100 d-flex flex-column">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h3 class="h5 m-0 font-weight-semibold">
                            <i class="bi bi-code-slash me-2 text-primary"></i>Generated Code
                        </h3>
                    </div>
                    <div class="flex-grow-1 mb-3">
                        <textarea id="codeEditor" class="form-control font-monospace h-100" rows="12" style="min-height: 250px;" placeholder="# AI generated code will appear here..."></textarea>
                    </div>
                    <button id="runCodeBtn" class="btn btn-outline-primary w-100 d-flex align-items-center justify-content-center gap-2">
                        <i class="bi bi-play-fill"></i> Test / Run Code
                    </button>
                </div>
            </div>
        </div>

        <div class="row mt-4">
            <div class="col-12">
                <div class="card p-4 shadow-sm">
                    <h3 class="h5 mb-3 font-weight-semibold">
                        <i class="bi bi-terminal me-2 text-primary"></i>Console Output
                    </h3>
                    <pre id="consoleOutput" class="bg-light text-dark p-3 rounded m-0 border" style="min-height: 80px;">Output will be displayed here...</pre>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/js/main.js"></script>
</body>
</html>
